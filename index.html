<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Week 1 · 日常生活与看法</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #181614;
    color: #F5F0E6;
    font-family: Georgia, 'Songti SC', serif;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .ui { font-family: system-ui, -apple-system, sans-serif; }
  button { font-family: inherit; }

  .header {
    padding: 22px 16px 16px;
    border-bottom: 1px solid #33302B;
    background: radial-gradient(ellipse at top left, rgba(178,58,46,0.18), transparent 60%), #181614;
  }
  .header-inner { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .kicker { font-size: 11px; letter-spacing: 3px; color: #C9A24B; text-transform: uppercase; font-weight: 600; }
  .title { margin: 4px 0 0; font-weight: 400; color: #F5F0E6; font-size: clamp(19px, 6vw, 26px); }
  .subtitle { font-size: 13px; color: #B8AC94; }
  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    background: transparent; border: 1px solid #33302B; color: #B8AC94;
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  .tab-btn.active { background: #2A2620; border-color: #C9A24B; color: #C9A24B; font-weight: 700; }

  .day-switcher { display: flex; overflow-x: auto; gap: 6px; padding: 16px 20px 6px; }
  .day-btn {
    flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1px solid #33302B;
    background: transparent; color: #B8AC94; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .day-btn.active { border-color: #C9A24B; background: #2A2620; color: #C9A24B; font-weight: 700; }

  .main { padding: 10px 20px 40px; max-width: 720px; width: 100%; margin: 0 auto; }

  .day-heading { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 18px; }
  .nav-arrow {
    background: transparent; border: 1px solid #33302B; border-radius: 8px; color: #B8AC94;
    padding: 6px 10px; cursor: pointer; font-size: 15px;
  }
  .nav-arrow:disabled { opacity: 0.35; cursor: default; }
  .day-title { font-size: 20px; text-align: center; }
  .day-theme { font-size: 13px; color: #C9A24B; text-align: center; }

  .card { background: #1F1C18; border: 1px solid #2A2620; border-radius: 10px; padding: 18px 18px 20px; margin-bottom: 16px; }
  .card.island { border-color: rgba(201,162,75,0.27); }
  .card.mission { border-color: rgba(166,58,46,0.33); }

  .section-label { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .section-n { font-size: 12px; color: #C9A24B; border: 1px solid rgba(201,162,75,0.33); border-radius: 4px; padding: 1px 6px; }
  .section-title { font-size: 15px; font-weight: 600; color: #F5F0E6; }
  .section-sub { font-size: 12px; color: #8a8574; }

  .speak-btn { border: none; background: transparent; cursor: pointer; color: #8a7350; padding: 4px; font-size: 15px; line-height: 1; }

  .island-row { display: flex; align-items: center; gap: 10px; }
  .island-hanzi { font-size: 22px; }
  .island-py { color: #C9A24B; font-size: 14px; margin-top: 2px; }
  .island-en { color: #B8AC94; font-size: 13px; }

  .word-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #2A2620; flex-wrap: wrap; }
  .word-left { display: flex; align-items: center; gap: 8px; min-width: 160px; }
  .word-hanzi { font-size: 21px; }
  .word-py { font-size: 13px; color: #C9A24B; }
  .word-en { font-size: 12.5px; color: #B8AC94; }

  .stamp {
    border-radius: 3px; transform: rotate(-2deg); padding: 2px 8px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.3px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; background: transparent;
  }

  .deck-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 12px; color: #8a8574; }
  .ghost-btn {
    background: transparent; border: 1px solid #33302B; border-radius: 6px; color: #B8AC94;
    padding: 5px 10px; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 5px;
  }
  .deck-box {
    background: #181410; border: 1px solid #2A2620; border-radius: 10px; padding: 26px 20px; text-align: center;
    min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .deck-tag { font-size: 11px; color: #C9A24B; letter-spacing: 1px; text-transform: uppercase; }
  .deck-hanzi-row { display: flex; align-items: center; gap: 10px; }
  .deck-hanzi { font-size: 26px; }
  .deck-py { font-size: 14px; color: #C9A24B; }
  .deck-en { font-size: 13px; color: #B8AC94; }
  .deck-nav { display: flex; justify-content: space-between; margin-top: 12px; }

  .dlg-line { display: flex; gap: 8px; align-items: flex-start; border-radius: 8px; padding: 6px 8px; margin-bottom: 4px; }
  .dlg-line.playing { background: #2A2620; }
  .dlg-avatar {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .dlg-avatar.A { background: rgba(76,122,99,0.2); color: #7FB79E; }
  .dlg-avatar.B { background: rgba(166,58,46,0.2); color: #D98A7D; }
  .dlg-hanzi { font-size: 17px; }
  .dlg-py { font-size: 13px; color: #C9A24B; }
  .dlg-en { font-size: 12.5px; color: #B8AC94; }
  .play-btn {
    font-size: 13px; background: transparent; border: 1px solid #4C7A63; color: #7FB79E;
    border-radius: 6px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
  }
  .play-btn.stop { border-color: #A63A2E; color: #D98A7D; }

  .prompt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .prompt-n { font-size: 12px; color: #5c5648; width: 16px; }
  .prompt-hanzi { font-size: 16px; }
  .prompt-py { font-size: 12.5px; color: #C9A24B; }

  .mission-label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .mission-text { font-size: 14px; color: #EADFC8; }
  .mission-text.done { color: #8a8574; text-decoration: line-through; }

  .progress-summary { font-size: 14px; color: #B8AC94; }
  .progress-bar-outer { height: 6px; background: #2A2620; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .progress-bar-inner { height: 100%; background: #C9A24B; transition: width .4s ease; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #B8AC94; margin: 24px 0; }
  .day-group { margin-bottom: 26px; }
  .day-group-title { font-size: 13px; color: #C9A24B; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .word-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .word-chip { background: #1F1C18; border: 1px solid #2A2620; border-radius: 8px; padding: 10px 12px; min-width: 128px; }
  .word-chip-top { display: flex; align-items: center; gap: 6px; }
  .word-chip-hanzi { font-size: 18px; }
  .word-chip-py { font-size: 11.5px; color: #8a8574; margin-bottom: 6px; }

  @media (max-width: 520px) {
    .header-inner { flex-direction: column; align-items: stretch; }
    .tabs { width: 100%; }
    .tabs .tab-btn { flex: 1; }
    .main { padding-left: 12px; padding-right: 12px; }
    .card { padding: 14px; }
    .day-switcher { padding-left: 12px; padding-right: 12px; }
  }

  input[type="checkbox"] { accent-color: #C9A24B; width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------------
   CONTENT — Week 1: 日常生活与看法 (Everyday life & opinions)
----------------------------------------------------------------- */

const DAYS = [

    prompts: [
      { ch: "今天工作怎么样？", py: "Jīntiān gōngzuò zěnmeyàng?" },

  { id: "tue", label: "Tuesday", theme: "Talking about your day",

      { ch: "顺便", py: "shùnbiàn", en: "while you're at it" },

      { ch: "终于", py: "zhōngyú", en: "finally" },
      { ch: "仍然", py: "réngrán", en: "still" },
      { ch: "结果", py: "jiéguǒ", en: "as a result / the result" },

    island: { ch: "你觉得呢？", py: "Nǐ juéde ne?", en: "What do you think?" },

      { s: "A", ch: "当然是中国菜！", py: "Dāngrán shì Zhōngguó cài!", en: "Chinese food, of course!" },

    prompts: [
      { ch: "你今天忙吗？", py: "Nǐ jīntiān máng ma?" },

      { ch: "你今天顺便做了什么？", py: "Nǐ jīntiān shùnbiàn zuòle shénme?" },

  { id: "wed", label: "Wednesday", theme: "Talking about movies",

      { s: "A", ch: "肯定的，他演得很好。", py: "Kěndìng de, tā yǎn de hěn hǎo.", en: "Definitely — he acted really well." },

    prompts: [

      { ch: "最近看的电影怎么样？", py: "Zuìjìn kàn de diànyǐng zěnmeyàng?" },
      { ch: "你估计我会喜欢这部电影吗？", py: "Nǐ gūjì wǒ huì xǐhuan zhè bù diànyǐng ma?" },
      { ch: "还有另外的电影推荐吗？", py: "Hái yǒu lìngwài de diànyǐng tuījiàn ma?" },

    mission: "Recommend a movie to your husband and use 尤其 and 肯定 while you talk about it.",

  { id: "thu", label: "Thursday", theme: "Talking with your husband",

function esc(str) {
  return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function currentDay() {
  const id = ALL_DAY_KEYS[state.dayIdx];

function shuffledIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function resetDeck() {
  const day = currentDay();
  const pool = (day.words || []).flatMap(w => (SENTENCE_BANK[w.ch] || []).map(s => ({ ...s, word: w.ch })));
  state._deckPool = pool;
  state.deckOrder = shuffledIndices(pool.length);
  state.deckPos = 0;
  state.revealed = false;
}

/* ---------------------------------------------------------------
   Speech
----------------------------------------------------------------- */
function speakOnce(text) {
  try {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.88;
    window.speechSynthesis.speak(u);
  } catch (e) { /* not available */ }
}

function speakSequence(texts, onLineStart, onDone) {
  if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return () => {};
  try { window.speechSynthesis.cancel(); } catch (e) { return () => {}; }
  let stopped = false;
  let i = 0;
  function playNext() {
    if (stopped) return;
    if (i >= texts.length) { onDone && onDone(); return; }
    onLineStart && onLineStart(i);
    try {
      const u = new SpeechSynthesisUtterance(texts[i]);
      u.lang = "zh-CN";
      u.rate = 0.88;
      u.onend = () => { if (!stopped) { i += 1; setTimeout(playNext, 450); } };
      u.onerror = () => { if (!stopped) { i += 1; setTimeout(playNext, 450); } };
      window.speechSynthesis.speak(u);
    } catch (e) { i += 1; setTimeout(playNext, 450); }
  }
  playNext();
  return () => { stopped = true; try { window.speechSynthesis.cancel(); } catch (e) {} };
}

/* ---------------------------------------------------------------
   Event binding (re-attached after every render)
----------------------------------------------------------------- */
function bindEvents() {
  document.querySelectorAll("[data-speak]").forEach(el => {
    el.addEventListener("click", () => speakOnce(el.getAttribute("data-speak")));
  });

  document.querySelectorAll("[data-action]").forEach(el => {
    const action = el.getAttribute("data-action");
    const fire = () => handleAction(action);
    if (el.tagName === "INPUT") {
      el.addEventListener("change", fire);
    } else {
      el.addEventListener("click", fire);
    }
  });
}

function handleAction(action) {
  const [type, a, b] = action.split(":");

  if (type === "view") {
    state.view = a;
    render();
    return;
  }

  if (type === "day") {
    state.dayIdx = parseInt(a, 10);
    resetDeck();
    if (stopSequence) { stopSequence(); stopSequence = null; }
    state.playingIdx = -1;
    render();
    return;
  }

  if (type === "nav") {
    if (a === "prev") state.dayIdx = Math.max(0, state.dayIdx - 1);
    if (a === "next") state.dayIdx = Math.min(6, state.dayIdx + 1);
    resetDeck();
    if (stopSequence) { stopSequence(); stopSequence = null; }
    state.playingIdx = -1;
    render();
    return;
  }

  if (type === "step") {
    const dayId = a, key = b;
    if (!state.steps[dayId]) state.steps[dayId] = {};
    state.steps[dayId][key] = !state.steps[dayId][key];
    persist();
    render();
    return;
  }

  if (type === "mission") {
    const dayId = a;
    state.missions[dayId] = !state.missions[dayId];
    persist();
    render();
    return;
  }

  if (type === "word") {
    const ch = action.slice(5); // preserve full word incl any ':' edge cases
    const cur = state.wordLevels[ch] || 0;
    state.wordLevels[ch] = (cur + 1) % 5;
    persist();
    render();
    return;
  }

  if (type === "deck") {
    if (a === "shuffle") { resetDeck(); }
    else if (a === "prev") { state.revealed = false; state.deckPos = (state.deckPos - 1 + state.deckOrder.length) % state.deckOrder.length; }
    else if (a === "next") { state.revealed = false; state.deckPos = (state.deckPos + 1) % state.deckOrder.length; }
    else if (a === "reveal") { state.revealed = true; }
    else if (a === "hide") { state.revealed = false; }
    render();
    return;
  }

  if (type === "dlg") {
    const day = currentDay();
    if (a === "play") {
      if (stopSequence) stopSequence();
      stopSequence = speakSequence(
        day.dialogue.map(l => l.ch),
        (i) => { state.playingIdx = i; render(); },
        () => { state.playingIdx = -1; stopSequence = null; render(); }
      );
    } else if (a === "stop") {
      if (stopSequence) { stopSequence(); stopSequence = null; }
      state.playingIdx = -1;
      render();
    }
    return;
  }
}

/* ---------------------------------------------------------------
   Persistence
----------------------------------------------------------------- */
function persist() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify({
        wordLevels: state.wordLevels,
        missions: state.missions,
        steps: state.steps,
      }), false);
    } catch (e) { /* storage unavailable */ }
  }, 300);
}

async function init() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      state.wordLevels = parsed.wordLevels || {};
      state.missions = parsed.missions || {};
      state.steps = parsed.steps || {};
    }
  } catch (e) { /* no saved state yet */ }
  resetDeck();
  render();
}

init();
</script>
</body>
</html>
